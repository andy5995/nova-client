# The Python client's dependencies, as ranges. The exact versions are in
# uv.lock: `uv sync` (run here, at the repo root) builds .venv from it, which
# is where linux/nova-client.service and the Pester tests look.
# python/requirements.txt is exported from the lock for pip installs; CI
# fails if it falls out of step:
#
#     uv export --frozen --no-dev --no-emit-project --no-hashes -o python/requirements.txt
#
# The PowerShell client needs none of this.

[project]
name = "nova-client"
version = "0"  # unused: never built. The client's version is VERSION / python/_version.py
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "python-dotenv>=1.0.1",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # The mock hub (python/tests/mock_server.py), for both test suites
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
]

[tool.uv]
package = false
